name: Build Android v8a

on:
  push:
    branches: [ main ] # 或者是 master
    paths:
      - 'simple_live_core/**' # 核心修复逻辑变动
      - 'simple_live_app/**' # 版本号变动
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"

      # 还原签名文件
      - name: Restore Keystore
        run: |
          # 1. 使用 printf 替代 echo，避免末尾产生换行符导致文件损坏
          printf "%s" "${{ secrets.ZI_FEI_YU }}" | base64 --decode > simple_live_app/android/my-release-key.jks
          
          cd simple_live_app/android
          # 2. 修正路径：jks 文件就在当前 android 目录下，直接写文件名即可
          echo "storeFile=my-release-key.jks" > key.properties
          echo "storePassword=123456" >> key.properties
          echo "keyPassword=123456" >> key.properties
          echo "keyAlias=mykey" >> key.properties
          
      - name: Clean and Restore packages
        run: |
          cd simple_live_app
          flutter clean
          # 强制删除插件注册缓存文件 (解决 auto_orientation_v2 幽灵报错)
          rm -f .flutter-plugins
          rm -f .flutter-plugins-dependencies
          rm -rf .dart_tool
          flutter pub get
          
      - name: Build APK
        run: |
          cd simple_live_app
          flutter clean
          flutter pub get
          # 针对 vivo/Android 15 优化
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-v8a-Build
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
